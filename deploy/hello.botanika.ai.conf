server {
    listen 80;
    server_name hello.botanika.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /home/botanika/acme;
    }

    location / {
        return 301 https://hello.botanika.ai$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hello.botanika.ai;
    root /home/botanika/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/hello.botanika.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hello.botanika.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache" always;

    location ~ /\. {
        deny all;
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
